name: Studio CI

# Lint, typecheck and Studio's own tests on every push to main and every change request. They
# hold Studio's laws (AGENTS.md). GitHub's own runners, which are free for a public repository.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: studio-ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1
        with:
          node-version-file: package.json
          cache: true
          run-install: true

      - name: Lint
        run: vp lint

  typecheck:
    name: Typecheck
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1
        with:
          node-version-file: package.json
          cache: true
          run-install: true

      - name: Download Electron
        run: vp run --filter @t3tools/desktop ensure:electron

      # Every package. The server implements the WebSocket RPCs in two halves to stay under
      # TypeScript's instantiation limit (packages/contracts/src/rpc.ts says why).
      - name: Typecheck
        run: vpr typecheck

  test:
    name: Studio's tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      # actions/checkout's cleanup runs submodule foreach, which fails on the orphaned gitlinks in
      # the vendored .repos tree, so this fetches the commit itself (as studio-windows.yml does).
      - name: Checkout
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GIT_TERMINAL_PROMPT: "0"
        run: |
          set -euo pipefail
          git init .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          auth="$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)"
          git -c http.extraheader="AUTHORIZATION: basic $auth" fetch --no-tags --depth=1 origin "$GITHUB_SHA"
          git sparse-checkout set --no-cone '/*' '!/.repos/'
          git -c checkout.workers=0 checkout --detach FETCH_HEAD
          # text-to-cad, at Studio's pin on its public fork (STUDIO.md).
          git submodule update --init --depth=1 text-to-cad

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1
        with:
          node-version-file: package.json
          cache: true
          run-install: true

      - name: The laws' own shape
        working-directory: scripts
        run: vp test run --config ../vite.config.ts --dir . studio-laws.test.ts

      - name: Lint rules
        working-directory: oxlint-plugin-t3code
        run: vp test run --config ../vite.config.ts --dir .

      # Studio's screens include browser tests (headless Chromium), installed as T3's CI does.
      - name: Resolve Playwright version
        id: playwright_version
        run: echo "version=$(node -p "require('./apps/web/node_modules/playwright/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Chromium
        id: chromium_cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-shell-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright_version.outputs.version }}

      - name: Install Chromium for browser tests
        if: steps.chromium_cache.outputs.cache-hit != 'true'
        run: node apps/web/node_modules/playwright/cli.js install --only-shell chromium

      - name: Install missing Chromium system dependencies
        run: |
          browser=$(find "$HOME/.cache/ms-playwright" -name chrome-headless-shell -type f -print -quit)
          test -n "$browser"
          if ldd "$browser" | grep '=> not found'; then
            node apps/web/node_modules/playwright/cli.js install-deps chromium
          fi

      - name: Studio's screens
        working-directory: apps/web
        run: vp test run src/components/workbench

      - name: Studio's server
        working-directory: apps/server
        run: vp test run src/plugins src/studio src/telemetry

      - name: Studio's desktop app
        working-directory: apps/desktop
        run: vp test run src/studio

      - name: The usage receiver
        run: node --test infra/usage/src/*.test.mjs
