name: Studio for Windows

# Builds Studio's Windows installer (scripts/build-studio-app.sh) on a Windows machine, unsigned,
# installs it there to check the CAD tools run, and keeps it as this run's artifact. Publishing it
# to amywork777/studio-download is a separate step, by hand (STUDIO.md, The Windows app).
on:
  push:
    branches: ["amy/studio-windows*"]
  workflow_dispatch:
    inputs:
      version:
        description: The version to build, like 0.1.3
        required: true

permissions:
  contents: read

concurrency:
  group: studio-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Studio for Windows
    runs-on: windows-latest
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    env:
      VERSION: ${{ inputs.version || '0.1.3' }}
    steps:
      # actions/checkout's cleanup runs submodule foreach, which fails on the orphaned gitlinks in
      # the vendored .repos tree (release-desktop.yml), so this fetches the commit itself.
      - name: Checkout
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GIT_TERMINAL_PROMPT: "0"
        run: |
          set -euo pipefail
          git init .
          git config core.longpaths true
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          auth="$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)"
          git -c http.extraheader="AUTHORIZATION: basic $auth" fetch --no-tags --depth=1 origin "$GITHUB_SHA"
          git sparse-checkout set --no-cone '/*' '!/.repos/'
          git -c checkout.workers=0 checkout --detach FETCH_HEAD
          # text-to-cad, at Studio's pin on its public fork (STUDIO.md).
          git submodule update --init --depth=1 text-to-cad

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1
        with:
          node-version-file: package.json
          cache: false
          run-install: false

      # The packages the desktop app is built from; the mobile app's stay out.
      - name: Install Studio's packages
        run: vp install --filter=@t3tools/desktop... --filter=t3... --filter=@t3tools/web... --filter=@t3tools/scripts...

      - name: Download Electron
        run: vp run --filter @t3tools/desktop ensure:electron

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc

      # The resource monitor's build links these (release-desktop.yml).
      - name: Install Spectre-mitigated MSVC libs
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $installPath = & $vswhere -products * -latest -property installationPath
          $setupExe = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\setup.exe"
          $proc = Start-Process -FilePath $setupExe `
            -ArgumentList "modify", "--installPath", "`"$installPath`"", "--add", `
            "Microsoft.VisualStudio.Component.VC.Runtimes.x86.x64.Spectre", "--quiet", "--norestart" `
            -Wait -PassThru -NoNewWindow
          if ($null -eq $proc -or $proc.ExitCode -ne 0) {
            $code = if ($null -ne $proc) { $proc.ExitCode } else { 1 }
            Write-Error "Visual Studio Installer failed with exit code $code"
            exit $code
          }

      # Its cache hashes every file its pattern matches, node_modules included, which took an hour
      # on Windows.
      - name: Setup uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: false

      # text-to-cad's runtime build copies the CAD viewer with rsync, which Git Bash lacks. An MSYS2
      # of this run's own, brought wholly up to date, has one; a wrapper on PATH runs it. Adding
      # rsync alone to the runner's older MSYS2 broke the day MSYS2 rebuilt it: the new rsync did
      # not start against the older libraries there.
      - name: Set up MSYS2 for rsync
        id: msys2
        uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2.33.0
        with:
          msystem: MSYS
          update: true
          install: rsync

      - name: Add rsync
        env:
          MSYS2_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
        run: |
          set -euo pipefail
          rsync_exe="$(cygpath -u "$MSYS2_LOCATION")/usr/bin/rsync.exe"
          bin="$(cygpath -u "$RUNNER_TEMP")/rsync-bin"
          mkdir -p "$bin"
          printf '#!/bin/sh\nexec "%s" "$@"\n' "$rsync_exe" >"$bin/rsync"
          chmod +x "$bin/rsync"
          "$bin/rsync" --version | head -1
          cygpath -w "$bin" >>"$GITHUB_PATH"

      # As scripts/setup-studio.sh does on a Mac.
      - name: Set up the CAD tools
        working-directory: text-to-cad
        run: |
          set -euo pipefail
          uv venv --python 3.14 .venv
          uv pip install --python .venv/Scripts/python.exe -r requirements-dev.txt
          npm ci
          npm run build:packages

      - name: Build Studio for Windows
        # The desktop build prints each command's own output, so a failed step says why.
        env:
          T3CODE_DESKTOP_VERBOSE: "1"
          # Empty until the repository has the variable, which makes a build that sends no usage counts.
          STUDIO_USAGE_URL: ${{ vars.STUDIO_USAGE_URL }}
        run: bash scripts/build-studio-app.sh "$VERSION"

      - name: Install it and check the CAD tools run
        shell: pwsh
        timeout-minutes: 30
        run: |
          $ErrorActionPreference = "Stop"
          $installer = "release\Studio-$env:VERSION-x64.exe"
          Write-Host "Installer: $([int]((Get-Item $installer).Length / 1MB)) MB"
          $timer = [Diagnostics.Stopwatch]::StartNew()
          $proc = Start-Process -FilePath $installer -ArgumentList "/S" -Wait -PassThru
          Write-Host "Installed in $([int]$timer.Elapsed.TotalSeconds) s, exit code $($proc.ExitCode)"
          if ($proc.ExitCode -ne 0) { exit $proc.ExitCode }
          # The one-click installer names the folder by the package name (text-to-cad-studio).
          $programs = Join-Path $env:LOCALAPPDATA "Programs"
          $exe = Get-ChildItem $programs -Filter Studio.exe -Recurse -Depth 1 | Select-Object -First 1
          if ($null -eq $exe) { throw "Studio.exe is not under $programs" }
          $app = $exe.DirectoryName
          Write-Host "Installed at $app"
          $files = Get-ChildItem -Recurse -File $app
          $longest = $files | Sort-Object { $_.FullName.Length } | Select-Object -Last 1
          Write-Host "$($files.Count) files; the longest path is $($longest.FullName.Length) characters: $($longest.FullName)"
          $cad = Join-Path $app "resources\studio"
          $rest = $files | Where-Object { -not $_.FullName.StartsWith($cad) }
          Write-Host "$($rest.Count) of them outside the CAD tools, by folder:"
          $rest | Group-Object { $_.DirectoryName.Substring($app.Length) } | Sort-Object Count -Descending |
            Select-Object -First 15 | ForEach-Object { Write-Host "  $($_.Count) in .$($_.Name)" }
          & (Join-Path $app "resources\studio\python\python.exe") -c "import cad_mcp.shim, cad_server.cli, OCP, netgen; print('The CAD tools import in the installed app.')"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # As the Mac build does: the installed app builds the example's plate and solves its
          # strength study, held to the answer the example ships with.
          $studio = Join-Path $app "resources\studio"
          & (Join-Path $studio "python\python.exe") scripts\studio-app-check.py $studio
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # A release must open: the installed app starts on a home of its own and shows its first screen.
          node scripts/studio-app-open-check.mjs $exe.FullName
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Keep the installer
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: studio-windows-${{ env.VERSION }}
          path: |
            release/Studio-${{ env.VERSION }}-x64.exe
            release/Studio-${{ env.VERSION }}-x64.exe.blockmap
            release/latest.yml
          if-no-files-found: error
          retention-days: 3
